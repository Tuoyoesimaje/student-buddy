<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - Student Buddy</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
      background-color: #f8f9fa;
      color: #333;
    }
    .container {
      max-width: 500px;
      padding: 40px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    h1 {
      color: #2d3748;
      margin-bottom: 10px;
      font-size: 2.5rem;
    }
    h2 {
      color: #4a5568;
      margin-top: 0;
      font-weight: normal;
      font-size: 1.5rem;
    }
    p {
      color: #4a5568;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    .error-code {
      font-size: 8rem;
      font-weight: 900;
      margin: 0;
      color: #e2e8f0;
      position: absolute;
      z-index: -1;
      user-select: none;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background-color: #4299e1;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 500;
      transition: background-color 0.3s;
    }
    .btn:hover {
      background-color: #3182ce;
    }
  </style>
</head>
<body>
  <div class="error-code">404</div>
  <div class="container">
    <h1>Page Not Found</h1>
    <h2>Oops! Looks like you're lost.</h2>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
    <a href="/" class="btn">Return to Home</a>
  </div>
</body>
</html>
