<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A modern student dashboard for managing studies and tasks" />
    
    <!-- Inline preflight theme script: set `dark` class before CSS loads to avoid flash -->
    <script>
      (function(){
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'dark') { document.documentElement.classList.add('dark'); return; }
          if (saved === 'light') { document.documentElement.classList.remove('dark'); return; }
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) { /* noop */ }
      })();
    </script>
    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/png" href="/favicon.ico" />
    
    <!-- Preload critical resources -->
    <link rel="preload" as="style" href="/src/index.css" />
    <link rel="stylesheet" href="/src/index.css" />
    
    <title>Student Buddy</title>
    
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
  </body>
</html>
